<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Serenity Bienestar</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-light bg-white shadow-sm mb-5">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">
                <i class="bi bi-heart-pulse-fill me-2"></i> SERENITY
            </a>
            <a href="index.html" class="btn btn-outline-primary btn-sm">Volver al Inicio</a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-5 rounded-5 shadow-sm">
                <h1 class="fw-bold h2 mb-4">Escríbenos</h1>
                <p class="text-muted mb-4">Si tienes dudas sobre nuestros artículos o quieres colaborar, completa este formulario.</p>

                <form class="needs-validation" id="contactForm" novalidate>
                    <div class="mb-3">
                        <label for="validationName" class="form-label fw-bold">Nombre completo</label>
                        <input type="text" class="form-control" id="validationName" required>
                        <div class="invalid-feedback">Por favor, introduce tu nombre.</div>
                    </div>

                    <div class="mb-3">
                        <label for="validationEmail" class="form-label fw-bold">Correo electrónico</label>
                        <input type="email" class="form-control" id="validationEmail" placeholder="nombre@ejemplo.com" required>
                        <div class="invalid-feedback">Introduce un correo electrónico válido.</div>
                    </div>

                    <div class="mb-3">
                        <label for="validationMsg" class="form-label fw-bold">Mensaje</label>
                        <textarea class="form-control" id="validationMsg" rows="4" required></textarea>
                        <div class="invalid-feedback">El mensaje no puede estar vacío.</div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="invalidCheck" required>
                            <label class="form-check-label small text-muted" for="invalidCheck">
                                Acepto la política de privacidad y el uso educativo de mis datos.
                            </label>
                            <div class="invalid-feedback">Debes aceptar los términos antes de enviar.</div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 py-3 fw-bold mt-3" type="submit">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        (function () {
          'use strict'
          var forms = document.querySelectorAll('.needs-validation')
          Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
              if (!form.checkValidity()) {
                event.preventDefault()
                event.stopPropagation()
              } else {
                event.preventDefault();
                alert('¡Formulario enviado con éxito (Simulación)!');
              }
              form.classList.add('was-validated')
            }, false)
          })
        })()
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
